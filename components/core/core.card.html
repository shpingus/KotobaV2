<!DOCTYPE html>

<style>
  body { margin: 0; padding: 22px; background: var(--bg-canvas); font-family: var(--font-body); }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
  .lbl { width: 100%; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 2px; }

<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Badge, Tag, Card, Avatar } = window.MichiDesignSystem_2b01f5;

  function Demo() {
    const [picked, setPicked] = React.useState(true);
    return (
      <div>

        <div className="grp"><span className="lbl">Icon buttons</span>

          <IconButton label="close" variant="ghost">{I('x')}</IconButton>
          <IconButton label="next" variant="accent">{I('arrow-right')}</IconButton>
          <IconButton label="settings" square>{I('settings')}</IconButton>

        <div className="grp"><span className="lbl">Badges &amp; tags</span>
          <Badge tone="success">Mastered</Badge>

          <Badge tone="neutral">12 cards</Badge>
          <Tag selected onClick={()=>{}}>Verbs</Tag>

        <div className="grp"><span className="lbl">Cards &amp; avatar</span>
          <Card interactive elevation="md" style={{display:'flex',alignItems:'center',gap:14,minWidth:220}}>
            <Avatar name="Aiko Tanaka" ring ringPercent={75} />
            <div>
              <div style={{fontWeight:700,color:'var(--text-strong)'}}>Aiko Tanaka</div>
              <div style={{fontSize:13,color:'var(--text-muted)'}}>75% of daily goal</div>
            </div>
          </Card>
          <Avatar name="K T" />
          <Avatar name="Yu" size="lg" />
        </div>
      </div>
    );

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 50);
