<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-canvas); font-family: var(--font-body); }
  .grp { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; margin-bottom: 20px; }
  .lbl { width: 100%; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); }
  .col { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 300px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Companion, ToriiGate, BossNode, StatBar, PowerLevel, QuestCard } = window.MichiDesignSystem_2b01f5;
  const I = (n) => <i data-lucide={n}></i>;
  function Demo() {
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div>
        <div className="grp"><span className="lbl">Kotodama (3 stages) · torii · bosses</span>
          <Companion stage={1} size={52} />
          <Companion stage={2} size={72} floating />
          <Companion stage={3} size={72} />
          <ToriiGate size={88} plaque="二" caption="Unit 2" />
          <ToriiGate size={88} state="locked" plaque="N4" />
          <BossNode label="Hiragana Oni" />
          <BossNode state="defeated" size="sm" />
        </div>
        <div className="grp">
          <div className="col"><span className="lbl">Stats &amp; power</span>
            <StatBar label="Vocabulary" jp="語彙" value={62} />
            <StatBar label="Listening" jp="聴解" value={31} tone="torii" weak />
            <PowerLevel value={47} />
          </div>
          <div className="col"><span className="lbl">Quests</span>
            <QuestCard title="Learn 20 food words" icon={I('utensils')} value={13} max={20} reward="+80 XP" />
            <QuestCard title="Defeat the Hiragana Oni" icon={I('swords')} value={0} max={1} reward="+150 XP" subtitle="Boss challenge · optional" />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
