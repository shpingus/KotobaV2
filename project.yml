name: Kotoba
options:
  bundleIdPrefix: com.kotoba
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
packages:
  KotobaDesignSystem:
    path: Packages/KotobaDesignSystem
  ContentKit:
    path: Packages/ContentKit
  LearningEngine:
    path: Packages/LearningEngine
  Persistence:
    path: Packages/Persistence
  FeatureOnboarding:
    path: Packages/Features/FeatureOnboarding
  FeaturePath:
    path: Packages/Features/FeaturePath
  FeatureLesson:
    path: Packages/Features/FeatureLesson
  FeatureBattle:
    path: Packages/Features/FeatureBattle
  FeatureSpirit:
    path: Packages/Features/FeatureSpirit
  FeatureSensei:
    path: Packages/Features/FeatureSensei
targets:
  KotobaApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KotobaApp/Sources
    resources:
      - path: KotobaApp/Resources
    dependencies:
      - package: KotobaDesignSystem
        product: KotobaDesignSystem
      - package: ContentKit
        product: ContentKit
      - package: LearningEngine
        product: LearningEngine
      - package: Persistence
        product: Persistence
      - package: FeatureOnboarding
        product: FeatureOnboarding
      - package: FeaturePath
        product: FeaturePath
      - package: FeatureLesson
        product: FeatureLesson
      - package: FeatureBattle
        product: FeatureBattle
      - package: FeatureSpirit
        product: FeatureSpirit
      - package: FeatureSensei
        product: FeatureSensei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kotoba.KotobaApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kotoba
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
schemes:
  Kotoba:
    build:
      targets:
        KotobaApp: all
    run:
      config: Debug
