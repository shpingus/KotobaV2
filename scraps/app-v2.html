<style>/* ============================================================
   Kotoba — Color tokens
   Palette story:
   - Ai (藍 indigo)      : the brand. Trust, focus, the deep "summit".
   - Kaki (柿 persimmon) : energy & streaks. The daily flame.
   - Wakaba (若葉 green) : growth, success, "you advanced".
   - Sumi (墨 ink)       : neutral text & surfaces, faint indigo cast.
   - Tier scale          : the JLPT path, brightening to a deep summit.
   Light-first. All base ramps + semantic aliases live here.
   ============================================================ */

:root {
  /* ---------- Ai · indigo (primary) ---------- */
  --ai-50:  #EEF0FB;
  --ai-100: #DDE2F6;
  --ai-200: #BBC5EC;
  --ai-300: #94A2DF;
  --ai-400: #6E7FD0;
  --ai-500: #4F61BE;
  --ai-600: #3D4CA0;
  --ai-700: #313E82;
  --ai-800: #283367;
  --ai-900: #1F284F;
  --ai-950: #141A36;

  /* ---------- Kaki · persimmon (accent / energy) ---------- */
  --kaki-50:  #FFF2EC;
  --kaki-100: #FFE1D3;
  --kaki-200: #FFC2A8;
  --kaki-300: #FF9D74;
  --kaki-400: #FB7948;
  --kaki-500: #F15F2C;
  --kaki-600: #D94A1C;
  --kaki-700: #B23A18;
  --kaki-800: #8E301A;
  --kaki-900: #722A19;

  /* ---------- Wakaba · green (success / growth) ---------- */
  --wakaba-50:  #EEF8EE;
  --wakaba-100: #D6EFD7;
  --wakaba-200: #AEDFB0;
  --wakaba-300: #7CCA80;
  --wakaba-400: #4FB45A;
  --wakaba-500: #2F9C45;
  --wakaba-600: #237D38;
  --wakaba-700: #1E632F;
  --wakaba-800: #1A4F2A;
  --wakaba-900: #154023;

  /* ---------- Kihada · gold (warning / highlight) ---------- */
  --kihada-50:  #FDF6E3;

  --kihada-300: #ECBC49;

  --kihada-500: #C9881C;
  --kihada-600: #A36916;
  --kihada-700: #7E5114;

  --beni-100: #FAD3DB;
  --beni-200: #F2A3B3;
  --beni-300: #E66E87;
  --beni-400: #D8556E;
  --beni-500: #C13355;
  --beni-600: #A02343;
  --beni-700: #7E1C36;

  --shu-100: #FAD9CE;
  --shu-200: #F3B09C;
  --shu-300: #E88066;
  --shu-400: #DA5839;
  --shu-500: #C93A1D;
  --shu-600: #A82E16;
  --shu-700: #862513;
  --shu-800: #6B2013;
  --shu-900: #571C12;

  /* ---------- Sumi · neutral ink (faint indigo cast) ---------- */
  --sumi-0:   #FFFFFF;
  --sumi-50:  #F7F8FB;
  --sumi-100: #EFF1F6;
  --sumi-200: #E2E5EE;
  --sumi-300: #CBD0DE;
  --sumi-400: #9AA1B5;
  --sumi-500: #6B7287;
  --sumi-600: #4D5468;
  --sumi-700: #383E4F;
  --sumi-800: #262B38;
  --sumi-900: #171A24;
  --sumi-950: #0E1019;

  /* ---------- JLPT tier path (brightening climb to summit) ---------- */
  --tier-pre: #7FB2D9;   /* Pre-N5 · sora · the start */
  --tier-n5:  #5FB87A;   /* N5 · wakaba */
  --tier-n4:  #E2B23C;   /* N4 · kihada */
  --tier-n3:  #ED7A3D;   /* N3 · kaki */
  --tier-n2:  #D8556E;   /* N2 · beni */
  --tier-n1:  #4F61BE;   /* N1 · ai · the summit */

  /* ============================================================
     Semantic aliases — reference these in product, not raw ramps
     ============================================================ */

  /* Brand */
  --brand:            var(--ai-600);
  --brand-strong:     var(--ai-700);
  --brand-soft:       var(--ai-100);
  --brand-subtle:     var(--ai-50);
  --on-brand:         var(--sumi-0);

  /* Accent / energy (streaks, flames, key CTAs) */
  --accent:           var(--kaki-500);
  --accent-strong:    var(--kaki-600);
  --accent-soft:      var(--kaki-100);
  --on-accent:        var(--sumi-0);

  /* Text */
  --text-strong:      var(--sumi-900);
  --text-body:        var(--sumi-700);
  --text-muted:       var(--sumi-500);
  --text-faint:       var(--sumi-400);
  --text-on-dark:     var(--sumi-0);
  --text-link:        var(--ai-600);

  /* Surfaces / backgrounds */
  --bg-canvas:        var(--sumi-50);
  --bg-raised:        var(--sumi-0);
  --surface-card:     var(--sumi-0);
  --surface-sunken:   var(--sumi-100);
  --surface-inverse:  var(--sumi-900);

  /* Borders / dividers */
  --border-subtle:    var(--sumi-200);
  --border-default:   var(--sumi-300);
  --border-strong:    var(--sumi-400);
  --border-brand:     var(--ai-300);

  /* Status */
  --success:          var(--wakaba-500);
  --success-soft:     var(--wakaba-100);
  --on-success:       var(--sumi-0);
  --warning:          var(--kihada-500);
  --warning-soft:     var(--kihada-100);
  --danger:           var(--beni-500);
  --danger-soft:      var(--beni-100);
  --on-danger:        var(--sumi-0);

  /* Focus ring */
  --focus-ring:       var(--ai-400);

  /* RPG layer · torii & power */
  --torii:            var(--shu-500);
  --torii-deep:       var(--shu-700);
  --torii-soft:       var(--shu-50);
  --power:            var(--kihada-400);
  --power-deep:       var(--kihada-600);
  --power-soft:       var(--kihada-50);
}

/* ============================================================
   Kotoba — Typography tokens
   Display & numerals : Space Grotesk  (crisp, characterful stats)
   Body & UI (Latin)  : Plus Jakarta Sans (warm, friendly, readable)
   Japanese body      : Zen Kaku Gothic New
   Japanese display    : Zen Maru Gothic (big friendly kana)
   ============================================================ */

:root {
  /* ---------- Families ---------- */
  --font-display: 'Space Grotesk', 'Zen Maru Gothic', system-ui, sans-serif;
  --font-body:    'Plus Jakarta Sans', 'Zen Kaku Gothic New', system-ui, sans-serif;
  --font-jp:      'Zen Kaku Gothic New', 'Plus Jakarta Sans', sans-serif;
  --font-jp-display: 'Zen Maru Gothic', 'Space Grotesk', sans-serif;
  --font-num:     'Space Grotesk', system-ui, sans-serif; /* tabular stats */

  /* ---------- Weights ---------- */
  --fw-regular:  400; /* @kind font */
  --fw-medium:   500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold:     700; /* @kind font */
  --fw-extra:    800; /* @kind font */

  /* ---------- Type scale (rem, 16px base) ---------- */
  --text-3xs: 0.6875rem;  /* 11 · micro labels */
  --text-2xs: 0.75rem;    /* 12 · captions */
  --text-xs:  0.8125rem;  /* 13 */
  --text-sm:  0.875rem;   /* 14 · secondary UI */
  --text-md:  1rem;       /* 16 · body */
  --text-lg:  1.125rem;   /* 18 · lead */
  --text-xl:  1.375rem;   /* 22 · h4 */
  --text-2xl: 1.75rem;    /* 28 · h3 */
  --text-3xl: 2.25rem;    /* 36 · h2 */
  --text-4xl: 2.875rem;   /* 46 · h1 */
  --text-5xl: 3.75rem;    /* 60 · display */
  --text-6xl: 4.75rem;    /* 76 · hero */

  /* ---------- Line heights ---------- */
  --leading-tight:  1.1;
  --leading-snug:   1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.7;   /* JP reading comfort */

  /* ---------- Letter spacing ---------- */
  --tracking-tight:  -0.02em;
  --tracking-snug:   -0.01em;
  --tracking-normal: 0;
  --tracking-wide:   0.04em;
  --tracking-caps:   0.12em;  /* eyebrow / overline */
}

/* ============================================================
   Kotoba — Spacing & layout tokens
   Base unit: 4px. Use the --space-* scale for all gaps,
   padding and margins. Container widths for app surfaces.
   ============================================================ */

:root {
  --space-0:   0;
  --space-1:   0.25rem;  /* 4 */
  --space-2:   0.5rem;   /* 8 */
  --space-3:   0.75rem;  /* 12 */
  --space-4:   1rem;     /* 16 */
  --space-5:   1.25rem;  /* 20 */
  --space-6:   1.5rem;   /* 24 */
  --space-7:   2rem;     /* 32 */
  --space-8:   2.5rem;   /* 40 */
  --space-9:   3rem;     /* 48 */
  --space-10:  4rem;     /* 64 */
  --space-11:  5rem;     /* 80 */
  --space-12:  6rem;     /* 96 */

  /* Component-level rhythm */
  --gutter:        var(--space-5);   /* screen edge padding (mobile) */
  --stack-tight:   var(--space-2);
  --stack:         var(--space-4);
  --stack-loose:   var(--space-6);

  /* Layout widths */
  --app-width:     420px;   /* mobile app canvas */
  --content-max:   1120px;  /* marketing content */
  --tap-min:       48px;    /* min hit target (>=44 a11y) */
}

/* ============================================================
   Kotoba — Elevation: radii, borders, shadows
   Shadows are soft and indigo-tinted (not neutral grey) so the
   light-first UI feels airy. The "press" tokens drive the
   tactile 3-D button: a solid darker edge that compresses on
   :active — the satisfying click that signals progress.
   ============================================================ */

:root {
  /* ---------- Corner radii ---------- */
  --radius-xs:   6px;
  --radius-sm:   10px;
  --radius-md:   14px;
  --radius-lg:   20px;   /* default card */
  --radius-xl:   28px;
  --radius-2xl:  36px;
  --radius-pill: 999px;  /* primary buttons, chips */

  /* ---------- Border widths ---------- */
  --border-thin:  1px;
  --border-base:  1.5px;
  --border-thick: 2px;

  /* ---------- Soft indigo-tinted shadows ---------- */
  --shadow-xs:  0 1px 2px rgba(31, 40, 79, 0.06);
  --shadow-sm:  0 2px 6px rgba(31, 40, 79, 0.08);
  --shadow-md:  0 6px 16px rgba(31, 40, 79, 0.10);
  --shadow-lg:  0 14px 32px rgba(31, 40, 79, 0.14);
  --shadow-xl:  0 24px 56px rgba(31, 40, 79, 0.18);

  /* Colored glow for celebratory / focal states */
  --glow-accent: 0 8px 24px rgba(241, 95, 44, 0.32);
  --glow-brand:  0 8px 24px rgba(79, 97, 190, 0.32);
  --glow-success: 0 8px 24px rgba(47, 156, 69, 0.30);

  /* ---------- Tactile press (3-D button) ---------- */
  --press-depth:        4px;   /* solid bottom edge height */
  --press-shadow:       inset 0 -4px 0 rgba(0,0,0,0.18);
  --press-shadow-soft:  inset 0 -3px 0 rgba(0,0,0,0.10);

  /* Focus ring */
  --ring: 0 0 0 4px rgba(110, 127, 208, 0.35);
}

/* ============================================================
   Kotoba — Motion tokens
   Movement is purposeful and a little springy: things ease out
   calmly, and rewards (level-ups, correct answers, streaks)
   get an overshoot "pop". No infinite decorative loops on
   content. Respect prefers-reduced-motion in product.
   ============================================================ */

:root {
  /* Durations */
  --dur-instant: 80ms;  /* @kind other */
  --dur-fast:    140ms; /* @kind other */
  --dur-base:    220ms; /* @kind other */
  --dur-slow:    340ms; /* @kind other */
  --dur-slower:  520ms; /* @kind other */

  /* Easing */
  --ease-out:     cubic-bezier(0.22, 0.80, 0.30, 1);   /* @kind other */
  --ease-in-out:  cubic-bezier(0.65, 0.05, 0.36, 1);   /* @kind other */
  --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);   /* @kind other */
  --ease-emphas:  cubic-bezier(0.16, 1, 0.30, 1);      /* @kind other */
}

/* ============================================================
   Kotoba — base element defaults & helpers
   Light, opinionated reset so specimen cards and product
   surfaces share a baseline. Kept minimal on purpose.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-md);
  line-height: var(--leading-normal);
  color: var(--text-body);
  background: var(--bg-canvas);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  color: var(--text-strong);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
  font-weight: var(--fw-bold);
}

p { margin: 0; }

a { color: var(--text-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Japanese text helper */
.jp { font-family: var(--font-jp); line-height: var(--leading-relaxed); }
.jp-display { font-family: var(--font-jp-display); }

/* Tabular numerals for stats */
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Eyebrow / overline */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--text-2xs);
  font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--text-muted);
}

:focus-visible {
  outline: none;
  box-shadow: var(--ring);
  border-radius: var(--radius-sm);
}

</style>

(function(){

/**
 * Kotoba Button — the primary tactile action.
 * Pill-shaped with a solid 3-D bottom edge that compresses on press,
 * giving the satisfying "click" that signals forward progress.
 */

const CSS = `
.kotoba-btn{
  --edge: var(--ai-800);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-body); font-weight:700; line-height:1;
  border:none; cursor:pointer; white-space:nowrap; text-decoration:none;
  border-radius:var(--radius-pill);
  background:var(--brand); color:var(--on-brand);
  box-shadow:0 var(--press-depth) 0 var(--edge);
  transition:transform var(--dur-fast) var(--ease-out),
             box-shadow var(--dur-fast) var(--ease-out),
             background var(--dur-fast) var(--ease-out),
             filter var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.kotoba-btn:hover{ filter:brightness(1.04); }
.kotoba-btn:active{ transform:translateY(var(--press-depth)); box-shadow:0 0 0 var(--edge); }
.kotoba-btn:focus-visible{ outline:none; box-shadow:0 var(--press-depth) 0 var(--edge), var(--ring); }

.kotoba-btn[data-size="sm"]{ padding:9px 16px; font-size:var(--text-sm); min-height:40px; }
.kotoba-btn[data-size="md"]{ padding:13px 22px; font-size:var(--text-md); min-height:48px; }
.kotoba-btn[data-size="lg"]{ padding:17px 30px; font-size:var(--text-lg); min-height:56px; }

.kotoba-btn[data-variant="accent"]{ background:var(--accent); color:var(--on-accent); --edge:var(--kaki-700); }
.kotoba-btn[data-variant="success"]{ background:var(--success); color:var(--on-success); --edge:var(--wakaba-700); }
.kotoba-btn[data-variant="danger"]{ background:var(--danger); color:var(--on-danger); --edge:var(--beni-700); }
.kotoba-btn[data-variant="secondary"]{
  background:var(--surface-card); color:var(--brand-strong);
  --edge:var(--sumi-300); box-shadow:0 var(--press-depth) 0 var(--edge); border:var(--border-thin) solid var(--border-default);
}
.kotoba-btn[data-variant="ghost"]{
  background:transparent; color:var(--text-body); box-shadow:none; font-weight:600;
}
.kotoba-btn[data-variant="ghost"]:hover{ background:var(--surface-sunken); filter:none; }
.kotoba-btn[data-variant="ghost"]:active{ transform:none; }

.kotoba-btn[data-full="true"]{ width:100%; }

`;

function useInjected(id, css) {
  React.useEffect(() => {
    if (document.getElementById(id)) return;
    const el = document.createElement('style');
    el.id = id; el.textContent = css;
    document.head.appendChild(el);
  }, [id, css]);
}

function Button({
  children,
  variant = 'primary',
  size = 'md',
  fullWidth = false,
  icon = null,
  iconRight = null,
  as = 'button',
  className = '',
  ...rest
}) {

  const Tag = as;
  const v = variant === 'primary' ? undefined : variant;

      className={`kotoba-btn ${className}`}
      data-variant={v}
      data-size={size}
      data-full={fullWidth || undefined}
      {...rest}
    >
      {icon}
      {children}
      {iconRight}
    </Tag>
  );
}

        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={thickness} />

          cx={size / 2}
          cy={size / 2}
          r={r}
          fill="none"
          stroke={color}

/** Renders any pixel matrix as crisp SVG. Shared by Companion and BossNode. */
function PixelSprite({ matrix, palette = PALETTE, size = 72, className = '', style, ...rest }) {
  const rows = matrix.length;
  const cols = matrix[0].length;
  const rects = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const c = matrix[y][x];
      if (c === '.' || !palette[c]) continue;
      rects.push(<rect key={`${x}-${y}`} x={x} y={y} width="1.02" height="1.02" fill={palette[c]} />);
    }
  }
  return (
    <svg
      viewBox={`0 0 ${cols} ${rows}`}
      width={size}
      height={(size * rows) / cols}
      shapeRendering="crispEdges"
      className={className}
      style={{ imageRendering: 'pixelated', ...style }}
      aria-hidden="true"
      {...rest}
    >
      {rects}
    </svg>
  );
}

/**
 * Kotoba SkillRadar — a 4-axis radar of the learner's skills. The shape makes
 * weakness obvious at a glance; sensei points at the dent.

function SkillRadar({
  stats = [],            // [{ label, jp, value }] — up to 6 axes, typically 4
  max = 100,
  size = 180,
  color = 'var(--brand)',
  className = '',
  ...rest
}) {
  const n = stats.length || 1;
  const cx = size / 2, cy = size / 2;
  const rMax = size * 0.34;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  const poly = (r) => stats.map((_, i) => pt(i, r).join(',')).join(' ');
  const dataPoly = stats.map((s, i) => pt(i, rMax * Math.max(0.05, Math.min(1, s.value / max))).join(',')).join(' ');
  const weakest = stats.reduce((w, s, i) => (s.value < stats[w].value ? i : w), 0);

  return (
    <div className={`kotoba-radar ${className}`} style={{ display: 'inline-flex' }} {...rest}>
      <svg width={size} height={size} aria-hidden="true">
        {[1, 0.66, 0.33].map((f) => (
          <polygon key={f} points={poly(rMax * f)} fill="none" stroke="var(--border-subtle)" strokeWidth="1.5" />
        ))}
        {stats.map((_, i) => {
          const [x, y] = pt(i, rMax);
          return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--border-subtle)" strokeWidth="1.5" />;
        })}
        <polygon points={dataPoly} fill={color} opacity="0.22" />
        <polygon points={dataPoly} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" />
        {stats.map((s, i) => {
          const [x, y] = pt(i, rMax * Math.max(0.05, Math.min(1, s.value / max)));
          const weak = i === weakest;
          return <circle key={i} cx={x} cy={y} r={weak ? 5 : 3.5} fill={weak ? 'var(--torii)' : color} stroke="#fff" strokeWidth="2" />;
        })}
        {stats.map((s, i) => {
          const [x, y] = pt(i, rMax + size * 0.105);
          return (
            <g key={i}>
              <text x={x} y={y - 3} textAnchor="middle"

                    fill="var(--text-muted)">{s.label}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>

%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E)', backgroundSize: 90 }} />}

  function Path({ unit, onStart, onBoss }) {

                state={l.state}

        ))}

  }

  return function HomePath({ onStartLesson, onBoss, streak = 28, xp = 1240 }) {
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div style={{ minHeight: '100%', background: 'var(--bg-canvas)' }}>

<script type="text/babel">
// Kotoba — Lesson flow (multiple-choice quiz → feedback → completion)
// Exposes window.Lesson.

const Lesson = (function () {
  const NS = window.MichiDesignSystem_2b01f5;
  const { KanaTile, Button, IconButton, ProgressRing, StreakCounter, SenseiChip } = NS;
  const I = (n, props = {}) => React.createElement('i', { 'data-lucide': n, ...props });

  const QUESTIONS = [
    {
      prompt: 'Which character reads', word: 'mizu', gloss: 'water',
      options: [
        { glyph: '水', reading: 'mizu', ok: true },
        { glyph: '火', reading: 'hi' },
        { glyph: '木', reading: 'ki' },
        { glyph: '金', reading: 'kane' },
      ],
    },
    {
      prompt: 'Tap the hiragana', word: 'ka', gloss: null,
      options: [
        { glyph: 'き', reading: 'ki' },
        { glyph: 'か', reading: 'ka', ok: true },
        { glyph: 'け', reading: 'ke' },
        { glyph: 'く', reading: 'ku' },
      ],
    },
    {
      prompt: 'Which character reads', word: 'neko', gloss: 'cat',
      options: [
        { glyph: '犬', reading: 'inu' },
        { glyph: '鳥', reading: 'tori' },
        { glyph: '猫', reading: 'neko', ok: true },
        { glyph: '魚', reading: 'sakana' },
      ],
    },
  ];

  function Feedback({ correct, answer, onNext, last }) {
    const ok = correct;
    return (
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 20,
        background: ok ? 'var(--success-soft)' : 'var(--danger-soft)',
        borderTopLeftRadius: 'var(--radius-xl)', borderTopRightRadius: 'var(--radius-xl)',
        padding: '22px 24px 40px', boxShadow: 'var(--shadow-xl)',
        animation: 'kotoba-sheet-up .28s var(--ease-emphas) both',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
          <span style={{
            width: 40, height: 40, borderRadius: '50%', display: 'inline-flex',
            alignItems: 'center', justifyContent: 'center', color: '#fff',
            background: ok ? 'var(--success)' : 'var(--danger)',
          }}>{I(ok ? 'check' : 'x', { style: { width: 24, height: 24 } })}</span>
          <div>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 20, color: ok ? 'var(--wakaba-700)' : 'var(--beni-700)' }}>
              {ok ? 'Nice!' : 'Not quite'}
            </div>
            <div style={{ fontSize: 14, color: ok ? 'var(--wakaba-700)' : 'var(--beni-700)' }}>
              {ok ? 'That\u2019s correct.' : <>The answer is <strong>{answer.glyph}</strong> \u2014 <em>{answer.reading}</em>.</>}
            </div>
          </div>
        </div>
        <Button fullWidth size="lg" variant={ok ? 'success' : 'danger'} onClick={onNext}>
          {last ? 'Finish' : 'Continue'}
        </Button>
      </div>
    );
  }

  function Complete({ onDone, xp = 40, accuracy = 100, streak = 29 }) {
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div style={{
        height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', textAlign: 'center', padding: '70px 28px 32px',
        boxSizing: 'border-box', background: 'var(--brand)', position: 'relative', overflow: 'hidden',
      }}>
        <div style={{ position: 'absolute', inset: 0, opacity: 0.16, backgroundImage: 'url(data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%2260%22%20viewBox%3D%220%200%20120%2060%22%20role%3D%22img%22%20aria-label%3D%22Seigaiha%20wave%20pattern%20tile%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3Cg%20id%3D%22wave%22%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2228%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2220%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%224%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%3C%2Fg%3E%0A%20%20%20%20%3CclipPath%20id%3D%22tile%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22120%22%20height%3D%2260%22%3E%3C%2Frect%3E%3C%2FclipPath%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Cg%20clip-path%3D%22url(%23tile)%22%20color%3D%22%234F61BE%22%20opacity%3D%220.5%22%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%220%22%20y%3D%2230%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2260%22%20y%3D%2230%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%22120%22%20y%3D%2230%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2230%22%20y%3D%2260%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2290%22%20y%3D%2260%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2230%22%20y%3D%220%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2290%22%20y%3D%220%22%3E%3C%2Fuse%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E)', backgroundSize: 120 }} />
        <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
          <div style={{
            width: 104, height: 104, borderRadius: '50%', background: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: 'var(--glow-accent)', animation: 'kotoba-pop .5s var(--ease-spring) both',
          }}>{I('trophy', { style: { width: 52, height: 52, color: 'var(--accent)' } })}</div>
          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 30, color: '#fff', marginTop: 22 }}>Lesson complete!</div>
          <div className="jp-display" style={{ fontSize: 18, color: 'rgba(255,255,255,0.85)', marginTop: 2 }}>よくできました</div>

          <div style={{ display: 'flex', gap: 12, marginTop: 28, width: '100%' }}>
            <Stat label="XP earned" value={`+${xp}`} icon="gem" />
            <Stat label="Accuracy" value={`${accuracy}%`} icon="target" />
            <Stat label="Streak" value={streak} icon="flame" />
          </div>
          <div style={{ height: 28 }} />
          <Button fullWidth size="lg" variant="accent" onClick={onDone}>Keep going</Button>
        </div>
      </div>
    );
  }

  function Stat({ label, value, icon }) {
    return (
      <div style={{ flex: 1, background: 'rgba(255,255,255,0.14)', borderRadius: 'var(--radius-md)', padding: '14px 6px' }}>
        <span style={{ color: 'rgba(255,255,255,0.9)', display: 'inline-flex' }}>{I(icon, { style: { width: 18, height: 18 } })}</span>
        <div style={{ fontFamily: 'var(--font-num)', fontWeight: 800, fontSize: 20, color: '#fff', marginTop: 4 }}>{value}</div>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.8)' }}>{label}</div>
      </div>
    );
  }

  return function Lesson({ onExit, onDone }) {
    const [qi, setQi] = React.useState(0);
    const [sel, setSel] = React.useState(null);
    const [checked, setChecked] = React.useState(false);
    const [done, setDone] = React.useState(false);
    const [correctCount, setCorrectCount] = React.useState(0);

    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

    if (done) return <Complete onDone={onDone} accuracy={Math.round((correctCount / QUESTIONS.length) * 100)} />;

    const q = QUESTIONS[qi];
    const answer = q.options.find((o) => o.ok);
    const isCorrect = checked && sel != null && q.options[sel].ok;
    const progress = ((qi + (checked ? 1 : 0)) / QUESTIONS.length) * 100;

    const tileState = (i) => {
      if (!checked) return sel === i ? 'selected' : 'default';
      if (q.options[i].ok) return 'correct';
      if (sel === i) return 'wrong';
      return 'default';
    };

    const onCheck = () => {
      if (sel == null) return;
      setChecked(true);
      if (q.options[sel].ok) setCorrectCount((c) => c + 1);
    };
    const onNext = () => {
      if (qi + 1 >= QUESTIONS.length) { setDone(true); return; }
      setQi(qi + 1); setSel(null); setChecked(false);
    };

    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg-canvas)', position: 'relative' }}>
        {/* top bar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '54px 18px 8px' }}>
          <IconButton label="Exit lesson" variant="ghost" size="sm" onClick={onExit}>{I('x', { style: { width: 22, height: 22 } })}</IconButton>
          <div style={{ flex: 1, height: 12, borderRadius: 999, background: 'var(--surface-sunken)', overflow: 'hidden' }}>
            <div style={{ height: '100%', width: `${progress}%`, borderRadius: 999, background: 'linear-gradient(90deg,var(--kaki-400),var(--accent))', transition: 'width .3s var(--ease-out)' }} />
          </div>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, color: 'var(--accent)', fontFamily: 'var(--font-num)', fontWeight: 800 }}>
            {I('heart', { fill: 'var(--accent)', style: { width: 18, height: 18 } })}5
          </span>
        </div>

        {/* question */}
        <div style={{ flex: 1, padding: '24px 24px 0', overflow: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-faint)' }}>
              Question {qi + 1} of {QUESTIONS.length}
            </div>
            {qi === 0 && <SenseiChip />}
          </div>
          <h2 style={{ fontSize: 26, marginTop: 10, lineHeight: 1.25 }}>
            {q.prompt} <span style={{ color: 'var(--brand)' }}>"{q.word}"</span>{q.gloss && <span style={{ color: 'var(--text-muted)', fontWeight: 400 }}> ({q.gloss})</span>}?
          </h2>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginTop: 26, paddingBottom: 24 }}>
            {q.options.map((o, i) => (
              <KanaTile
                key={i}
                glyph={o.glyph}
                reading={checked ? o.reading : ' '}
                size="lg"
                state={tileState(i)}
                interactive={!checked}
                onClick={() => !checked && setSel(i)}
                style={{ width: '100%', boxSizing: 'border-box' }}
              />
            ))}
          </div>
        </div>

        {/* check button (hidden while feedback sheet shows) */}
        {!checked && (
          <div style={{ padding: '12px 24px 36px' }}>
            <Button fullWidth size="lg" onClick={onCheck} disabled={sel == null}>Check</Button>
          </div>
        )}
        {checked && <Feedback correct={isCorrect} answer={answer} onNext={onNext} last={qi + 1 >= QUESTIONS.length} />}
      </div>
    );
  };
})();

Object.assign(window, { Lesson });

</script>

// Kotoba — Boss battle (intro → quiz battle → victory). Optional challenge:
// correct answers strike the oni; wrong answers cost a heart. Calm, not scary.
// Exposes window.BossBattle.

const BossBattle = (function () {
  const NS = window.MichiDesignSystem_2b01f5;
  const { BossNode, Companion, KanaTile, Button, IconButton, PowerLevel, Badge } = NS;
  const I = (n, props = {}) => React.createElement('i', { 'data-lucide': n, ...props });

  const QUESTIONS = [
    { prompt: 'Strike with the reading of', word: '川', gloss: 'river',
      options: [{ t: 'kawa', ok: true }, { t: 'yama' }, { t: 'kana' }, { t: 'kawi' }] },
    { prompt: 'Strike with the kana for', word: 'sa', gloss: null,
      options: [{ t: 'き' }, { t: 'さ', ok: true }, { t: 'ち' }, { t: 'せ' }] },
    { prompt: 'Strike with the meaning of', word: '火', gloss: 'hi',
      options: [{ t: 'water' }, { t: 'tree' }, { t: 'fire', ok: true }, { t: 'gold' }] },

  function HPBar({ value, max, color, label }) {

    const [qi, setQi] = React.useState(0);
    const [bossHp, setBossHp] = React.useState(BOSS_HP);
    const [hearts, setHearts] = React.useState(3);
    const [sel, setSel] = React.useState(null);
    const [checked, setChecked] = React.useState(false);
    const [shake, setShake] = React.useState(false);

    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

    if (phase === 'intro') {
      return (
        <div style={{
          height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: '70px 26px 32px', boxSizing: 'border-box', textAlign: 'center',
          background: 'linear-gradient(180deg, var(--torii-soft), var(--bg-canvas) 55%)',
        }}>
          <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: '0.12em', color: 'var(--torii)', textTransform: 'uppercase' }}>Boss challenge · optional</div>
          <h2 style={{ fontSize: 28, marginTop: 8 }}>Hiragana Oni</h2>
          <div className="jp-display" style={{ fontSize: 16, color: 'var(--text-muted)', marginTop: 2 }}>ひらがなの鬼</div>

          <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: 34, margin: '30px 0 22px' }}>
            <div>
              <NS.Companion stage={2} size={74} floating />
              <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--brand)', marginTop: 6 }}>Yūki · 49</div>
            </div>
            <div className="jp-display" style={{ fontSize: 22, color: 'var(--text-faint)', paddingBottom: 34 }}>VS</div>
            <div>
              <BossNode size="lg" flag={null} style={{ pointerEvents: 'none' }} />
              <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--torii)', marginTop: 6 }}>Oni · 12</div>
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 26 }}>
            <Badge tone="warning">Reward: +150 XP</Badge>
            <Badge tone="brand">Power +2</Badge>
          </div>
          <Button size="lg" fullWidth variant="danger" style={{ background: 'var(--torii)' }} onClick={() => setPhase('battle')}>Begin battle</Button>
          <Button variant="ghost" onClick={onExit} style={{ marginTop: 8 }}>Not yet</Button>
        </div>
      );
    }

    if (phase === 'victory') {
      return (
        <div style={{
          height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          padding: '70px 28px 32px', boxSizing: 'border-box', textAlign: 'center',
          background: 'var(--ai-700)', position: 'relative', overflow: 'hidden',
        }}>
          <div style={{ position: 'absolute', inset: 0, opacity: 0.14, backgroundImage: 'url(data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%2260%22%20viewBox%3D%220%200%20120%2060%22%20role%3D%22img%22%20aria-label%3D%22Seigaiha%20wave%20pattern%20tile%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3Cg%20id%3D%22wave%22%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2228%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2220%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%224%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%3E%3C%2Fcircle%3E%0A%20%20%20%20%3C%2Fg%3E%0A%20%20%20%20%3CclipPath%20id%3D%22tile%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22120%22%20height%3D%2260%22%3E%3C%2Frect%3E%3C%2FclipPath%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Cg%20clip-path%3D%22url(%23tile)%22%20color%3D%22%234F61BE%22%20opacity%3D%220.5%22%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%220%22%20y%3D%2230%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2260%22%20y%3D%2230%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%22120%22%20y%3D%2230%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2230%22%20y%3D%2260%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2290%22%20y%3D%2260%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2230%22%20y%3D%220%22%3E%3C%2Fuse%3E%0A%20%20%20%20%3Cuse%20href%3D%22%23wave%22%20x%3D%2290%22%20y%3D%220%22%3E%3C%2Fuse%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E)', backgroundSize: 120 }} />

              <Badge tone="warning" solid>+150 XP</Badge>
              <Badge tone="brand" solid style={{ background: 'rgba(255,255,255,0.2)' }}>Power 49 → 51</Badge>
            </div>
            <div style={{ height: 30 }} />
            <Button fullWidth size="lg" variant="accent" onClick={onWin}>Claim reward</Button>
          </div>
        </div>
      );
    }

    // battle
    const q = QUESTIONS[qi % QUESTIONS.length];
    const tileState = (i) => {
      if (!checked) return sel === i ? 'selected' : 'default';
      if (q.options[i].ok) return 'correct';
      if (sel === i) return 'wrong';
      return 'default';
    };
    const onCheck = () => {
      if (sel == null) return;
      setChecked(true);
      if (q.options[sel].ok) {
        setShake(true);
        setTimeout(() => setShake(false), 450);
        setBossHp((h) => h - 1);
      } else {
        setHearts((h) => Math.max(0, h - 1));
      }
    };
    const onNext = () => {
      if (bossHp <= 0) { setPhase('victory'); return; }
      setQi(qi + 1); setSel(null); setChecked(false);
    };

    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg-canvas)' }}>
        {/* battle header */}
        <div style={{ padding: '54px 18px 10px', borderBottom: '1px solid var(--border-subtle)', background: 'var(--torii-soft)' }}>

            <HPBar value={bossHp} max={BOSS_HP} color="var(--torii)" label="Oni" />
          </div>
        </div>

        <div style={{ flex: 1, padding: '22px 24px 0', overflow: 'auto' }}>
          <h2 style={{ fontSize: 24, lineHeight: 1.3 }}>
            {q.prompt} <span className="jp-display" style={{ color: 'var(--torii)' }}>{q.word}</span>
            {q.gloss && <span style={{ color: 'var(--text-muted)', fontWeight: 400 }}> ({q.gloss})</span>}
          </h2>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 13, marginTop: 22, paddingBottom: 20 }}>
            {q.options.map((o, i) => (
              <KanaTile key={i} glyph={o.t} size="sm" state={tileState(i)} interactive={!checked}
                        onClick={() => !checked && setSel(i)} style={{ width: '100%', boxSizing: 'border-box' }} />
            ))}
          </div>
        </div>

        <div style={{ padding: '12px 24px 36px' }}>
          {!checked
            ? <Button fullWidth size="lg" style={{ background: 'var(--torii)' }} onClick={onCheck} disabled={sel == null}>Strike</Button>
            : <Button fullWidth size="lg" variant={q.options[sel]?.ok ? 'success' : 'secondary'} onClick={onNext}>{bossHp <= 0 ? 'Finish him!' : 'Next'}</Button>}
        </div>
      </div>
    );
  };
})();

Object.assign(window, { BossBattle });

</script>

    <div style={{
      flex: 'none', display: 'flex', borderTop: '1px solid var(--border-subtle)',
      background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
      padding: '8px 8px 26px',
    }}>
      {TABS.map(([id, label, icon]) => {
        const on = active === id;
        return (
          <button key={id} onClick={() => onChange(id)} style={{
            flex: 1, border: 'none', background: 'transparent', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '6px 0',
            color: on ? 'var(--brand)' : 'var(--text-faint)',
          }}>
            {I(icon, { fill: on ? 'var(--brand-soft)' : 'none', style: { width: 24, height: 24 } })}
            <span style={{ fontSize: 11, fontWeight: 700 }}>{label}</span>
          </button>
        );
      })}
    </div>
  );
}

const REVIEW_WORDS = [
  { glyph: '水', reading: 'mizu', meaning: 'water' },
  { glyph: '本', reading: 'hon', meaning: 'book' },
  { glyph: '山', reading: 'yama', meaning: 'mountain' },
  { glyph: '日', reading: 'hi', meaning: 'day / sun' },
];

function Review({ onStart }) {
  const { SenseiCard } = NS;
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <div style={{ minHeight: '100%', background: 'var(--bg-canvas)', padding: '54px 20px 28px' }}>
      <h2 style={{ fontSize: 26 }}>Review</h2>
      <p style={{ color: 'var(--text-muted)', marginTop: 6, marginBottom: 16, fontSize: 15 }}>Spaced practice keeps words from fading. You have 12 due today.</p>
      <SenseiCard
        title={<span>You mix up <span className="jp">ね</span> and <span className="jp">ぬ</span></span>}
        actions={<Button size="sm" variant="accent" onClick={onStart}>Practice 2 min</Button>}
        style={{ marginBottom: 14 }}
      >
        I crafted a short set focused on the loop endings — 8 cards from your last three sessions.
      </SenseiCard>
      <Card tone="brand" pad="lg" style={{ marginBottom: 22, display: 'flex', alignItems: 'center', gap: 16 }}>
        <NS.ProgressRing value={12} max={12} size={64} color="var(--accent)">
          <span style={{ fontSize: 15 }}>12</span>
        </NS.ProgressRing>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, color: 'var(--text-strong)', fontSize: 16 }}>Due for review</div>
          <div style={{ fontSize: 13, color: 'var(--text-body)' }}>~4 min · +30 XP</div>
        </div>
      </Card>
      <Button fullWidth size="lg" variant="accent" onClick={onStart} icon={I('play', { style: { width: 18, height: 18 } })}>Start review</Button>
      <div style={{ fontWeight: 700, color: 'var(--text-strong)', fontSize: 15, margin: '26px 0 12px' }}>Coming up</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {REVIEW_WORDS.map((w) => (
          <Card key={w.glyph} pad="sm" style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <span className="jp-display" style={{ fontSize: 34, color: 'var(--text-strong)', width: 44, textAlign: 'center' }}>{w.glyph}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: 'var(--font-num)', fontWeight: 700, color: 'var(--brand-strong)' }}>{w.reading}</div>
              <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>{w.meaning}</div>
            </div>
            <Badge tone="neutral" size="sm">Lv 2</Badge>
          </Card>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = React.useState('home'); // home | review | spirit | profile | onboarding | lesson | boss
  const [tab, setTab] = React.useState('home');
  const [streak, setStreak] = React.useState(28);

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const IOSDevice = window.IOSDevice;
  const { Onboarding, HomePath, Lesson, Profile, CharacterSheet, BossBattle } = window;

  let content, showTabs = false;
  if (screen === 'onboarding') {
    content = <Onboarding onDone={() => { setScreen('home'); setTab('home'); }} />;
  } else if (screen === 'lesson') {
    content = <Lesson onExit={() => setScreen('home')} onDone={() => { setStreak((s) => s + 1); setScreen('home'); setTab('home'); }} />;
  } else if (screen === 'boss') {
    content = <BossBattle onExit={() => { setScreen(tab); }} onWin={() => { setScreen('spirit'); setTab('spirit'); }} />;
  } else {
    showTabs = true;
    if (tab === 'home') content = <HomePath onStartLesson={() => setScreen('lesson')} onBoss={() => setScreen('boss')} streak={streak} />;
    else if (tab === 'review') content = <Review onStart={() => setScreen('lesson')} />;
    else if (tab === 'spirit') content = <CharacterSheet onStartPractice={() => setScreen('lesson')} onBoss={() => setScreen('boss')} />;
    else content = <Profile onReplayIntro={() => setScreen('onboarding')} />;
  }

  return (
    <IOSDevice>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg-canvas)' }}>
        <div key={screen + tab} className="screen-fade" style={{ flex: 1, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
          {content}
        </div>
        {showTabs && <TabBar active={tab} onChange={(t) => { setTab(t); setScreen(t); }} />}
      </div>
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
setTimeout(() => window.lucide && window.lucide.createIcons(), 120);
</script>
</body></html>
