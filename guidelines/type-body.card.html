<!-- @dsCard group="Type" viewport="700x180" name="Body · Plus Jakarta Sans" subtitle="UI labels and reading copy — warm, friendly, legible." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-raised); font-family: var(--font-body); color: var(--text-body); }
  .lead { font-size: 18px; color: var(--text-strong); font-weight: 600; }
  p { font-size: 15px; line-height: 1.5; max-width: 600px; margin-top: 8px; }
  .wts { margin-top: 12px; display:flex; gap:16px; font-size:15px; }
  .meta { font-size: 12px; color: var(--text-muted); margin-top: 14px; }
  .meta b { color: var(--text-body); }
</style>
</head>
<body>
  <div class="lead">Learn a little, every day.</div>
  <p>Build a habit you can keep. Short lessons, gentle review, and a path that always shows your next step — so progress feels inevitable.</p>
  <div class="wts">
    <span style="font-weight:400">Regular</span>
    <span style="font-weight:500">Medium</span>
    <span style="font-weight:600">Semibold</span>
    <span style="font-weight:700">Bold</span>
    <span style="font-style:italic">Italic</span>
  </div>
  <div class="meta">Plus Jakarta Sans · <b>--font-body</b></div>
</body>
</html>
