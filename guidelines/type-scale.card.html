<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="--text-6xl down to --text-2xs, the modular scale in use." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--bg-raised); font-family: var(--font-body); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .spec { font-family: var(--font-display); color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; line-height: 1.1; }
  .tag { font-family: var(--font-num); font-size: 11px; color: var(--text-muted); width: 130px; flex: 0 0 auto; }
</style>
</head>
<body>
  <div id="t"></div>
  <script>
    const rows = [
      ['--text-5xl','60 · display','Aa 道'],
      ['--text-4xl','46 · h1','Aa 道'],
      ['--text-3xl','36 · h2','Aa 道'],
      ['--text-2xl','28 · h3','Begin lesson'],
      ['--text-xl','22 · h4','Begin lesson'],
      ['--text-lg','18 · lead','Today\u2019s review'],
      ['--text-md','16 · body','Today\u2019s review set'],
      ['--text-sm','14 · UI','Continue learning'],
      ['--text-2xs','12 · caption','STREAK · XP · LEVEL']
    ];
    document.getElementById('t').innerHTML = rows.map(([v,t,s]) =>
      '<div class="row"><div class="tag">'+t+'</div><div class="spec" style="font-size:var('+v+')">'+s+'</div></div>'
    ).join('');
  </script>
</body>
</html>
