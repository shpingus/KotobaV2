<!-- @dsCard group="Type" viewport="700x180" name="Display · Space Grotesk" subtitle="Headlines, level numbers, hero stats — crisp and characterful." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-raised); }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 52px; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-top: 14px; display:flex; gap: 18px; }
  .meta b { color: var(--text-body); font-weight: 600; }
  .wts { font-family: var(--font-display); margin-top: 10px; display:flex; gap:18px; font-size:22px; color:var(--text-body); align-items:baseline;}
</style>
</head>
<body>
  <div class="big">Every step forward</div>
  <div class="wts">
    <span style="font-weight:400">Regular</span>
    <span style="font-weight:500">Medium</span>
    <span style="font-weight:600">Semibold</span>
    <span style="font-weight:700">Bold</span>
  </div>
  <div class="meta"><span>Space Grotesk</span><span><b>--font-display</b></span><span>tracking −0.02em</span></div>
</body>
</html>
