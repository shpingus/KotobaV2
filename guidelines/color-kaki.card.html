<!-- @dsCard group="Colors" viewport="700x172" name="Kaki · Persimmon (accent)" subtitle="accent · energy · streaks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-raised); }
  .ramp { display: flex; gap: 6px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.04); }
  .k { font-family: var(--font-num); font-size: 11px; font-weight: 600; color: var(--text-strong); }
  .v { font-family: var(--font-num); font-size: 10px; color: var(--text-muted); letter-spacing: 0.02em; }
  .lead { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .lead b { font-family: var(--font-display); font-size: 15px; color: var(--text-strong); }
  .lead span { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="lead"><b>Kaki 柿</b><span>accent · energy · streaks</span></div>
  <div class="ramp" id="r"></div>
  <script>
    const steps = [50,100,200,300,400,500,600,700,800,900];
    const cs = getComputedStyle(document.documentElement);
    document.getElementById('r').innerHTML = steps.map(s => {
      const v = cs.getPropertyValue('--kaki-'+s).trim();
      const star = (s===500) ? ' ★' : '';
      return '<div class="sw"><div class="chip" style="background:'+v+'"></div><div class="k">'+s+star+'</div><div class="v">'+v+'</div></div>';
    }).join('');
  </script>
</body>
</html>
